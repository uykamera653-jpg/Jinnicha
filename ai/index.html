<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1738"><title>Findo AI Yordamchi</title><style>:root{--b:#2166f3;--d:#0b1738;--bg:#f5f8ff;--muted:#718096;--line:#e2e8f2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#dce8ff,transparent 30%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#101828}.wrap{width:min(900px,100%);margin:auto;padding:20px 14px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.logo{font-size:30px;font-weight:950;letter-spacing:-2.5px;color:var(--b);text-decoration:none}.back{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-weight:850}.app{height:min(760px,calc(100vh - 90px));min-height:560px;background:rgba(255,255,255,.9);border:1px solid #dfe7f3;border-radius:30px;box-shadow:0 25px 80px rgba(25,55,110,.13);overflow:hidden;display:flex;flex-direction:column}.head{padding:18px 20px;background:linear-gradient(135deg,#09142f,#2166f3);color:#fff;display:flex;align-items:center;gap:12px}.orb{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#fff,#a8c5ff);color:var(--b);display:grid;place-items:center;font-size:23px}.head h1{font-size:17px;margin:0}.head p{font-size:10px;color:#d8e5ff;margin:4px 0 0}.msgs{flex:1;overflow:auto;padding:20px;background:linear-gradient(#f7faff,#fff)}.msg{max-width:78%;padding:12px 14px;border-radius:18px;margin-bottom:10px;font-size:13px;line-height:1.55;white-space:pre-wrap}.bot{background:#edf3ff;border-bottom-left-radius:5px}.user{margin-left:auto;background:var(--b);color:#fff;border-bottom-right-radius:5px}.quick{display:flex;gap:7px;overflow:auto;padding:9px 12px;background:#fff;border-top:1px solid var(--line)}.quick button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:850;color:#536176}.input{display:flex;gap:8px;padding:11px 12px;background:#fff}.input textarea{flex:1;height:48px;resize:none;border:1px solid #d9e2ef;border-radius:15px;padding:12px;outline:0;font:inherit;font-size:13px}.input button{width:50px;border:0;border-radius:15px;background:var(--b);color:#fff;font-size:20px;font-weight:900}@media(max-width:600px){.wrap{padding:8px}.top{padding:4px 6px}.app{height:calc(100vh - 65px);min-height:0;border-radius:23px}.msg{max-width:88%;font-size:12px}.head{padding:15px}.orb{width:43px;height:43px}}
</style></head><body><div class="wrap"><div class="top"><a class="logo" href="/">Find<span style="color:#101828">o</span></a><button class="back" onclick="location.href='/'">← Bosh sahifa</button></div><main class="app"><header class="head"><div class="orb">✦</div><div><h1>Findo AI Yordamchi</h1><p>Maslahat beradi • tushuntiradi • sizni kerakli funksiyaga yo‘naltiradi</p></div></header><div id="msgs" class="msgs"></div><div class="quick"><button data-q="Telefonim yo‘qoldi, nima qilay?">📱 Telefonim yo‘qoldi</button><button data-q="Yo‘qolgan buyumga e’lonni qanday beraman?">📌 E’lon berish</button><button data-q="AI Qidiruv bilan qanday qidiraman?">🔎 AI Qidiruv</button><button data-q="Findo QR nima uchun kerak?">🔗 Findo QR</button></div><div class="input"><textarea id="input" placeholder="Savolingizni yozing…"></textarea><button id="send">➤</button></div></main></div><script>const msgs=document.getElementById('msgs'),input=document.getElementById('input'),send=document.getElementById('send');let history=[];function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}function init(){const x='Assalomu alaykum! Men Findo AI Yordamchiman. Buyumingizni topish, e’lon berish yoki Findo funksiyalaridan foydalanish bo‘yicha yordam beraman. Nima bo‘ldi?';history=[{role:'assistant',content:x}];add('assistant',x)}async function ask(){const text=input.value.trim();if(!text)return;input.value='';add('user',text);history.push({role:'user',content:text});send.disabled=true;send.textContent='…';const wait=document.createElement('div');wait.className='msg bot';wait.textContent='O‘ylayapman…';msgs.appendChild(wait);msgs.scrollTop=msgs.scrollHeight;try{const r=await fetch('/api/ai-assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const d=await r.json();if(!r.ok)throw Error(d.error||'AI yordamchi ishlamadi');wait.remove();history.push({role:'assistant',content:d.reply});add('assistant',d.reply)}catch(e){wait.textContent=e.message||'AI yordamchi vaqtincha ishlamayapti.'}finally{send.disabled=false;send.textContent='➤'}}send.onclick=ask;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;ask()});init();</script></body></html>
