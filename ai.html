<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Findo AI</title><style>body{margin:0;background:#f5f7fb;color:#111827;font-family:Inter,system-ui,Arial}.wrap{max-width:760px;margin:auto;padding:28px 18px}.brand{font-size:28px;font-weight:900;color:#2457ff}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 12px 35px #1118270b}textarea{width:100%;min-height:150px;border:1px solid #dfe4ec;border-radius:12px;padding:13px;box-sizing:border-box;font-size:16px;resize:vertical}button{border:0;border-radius:11px;background:#2457ff;color:#fff;padding:12px 17px;font-weight:800;margin-top:12px}.result{margin-top:18px;background:#f7f9fc;border-radius:13px;padding:16px;white-space:pre-wrap;line-height:1.55}.muted{color:#697386}.back{color:#2457ff;text-decoration:none;font-weight:700}</style></head><body><div class="wrap"><a class="back" href="/">← Findo'ga qaytish</a><div class="brand" style="margin-top:20px">Findo AI 🤖</div><p class="muted">Yo‘qolgan yoki topilgan narsangizni yozing. AI uni tartiblaydi va qidirish uchun eng muhim belgilarni ajratadi.</p><div class="card"><textarea id="text" placeholder="Masalan: Kecha Chilonzorda qora g‘ilofli iPhone 15 Pro telefonim yo‘qoldi. Orqa qismida kichik tirnalgan joy bor..."></textarea><button onclick="analyze()">✨ AI bilan tahlil qilish</button><div id="out" class="result" style="display:none"></div></div><div class="card"><h3>AI Match</h3><p class="muted">Bu bo‘lim keyingi bosqichda Findo bazasidagi topilgan e’lonlarni avtomatik solishtiradi.</p></div></div><script>async function analyze(){const text=document.getElementById('text').value.trim(),out=document.getElementById('out');if(!text){out.style.display='block';out.textContent='Avval tavsif yozing.';return}out.style.display='block';out.textContent='AI tahlil qilmoqda…';try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'analyze',text})});const d=await r.json();if(!r.ok)throw Error(d.error||'Xatolik');out.textContent=`Nomi: ${d.title||'-'}\nKategoriya: ${d.category||'-'}\nHolat: ${d.type==='lost'?'Yo‘qolgan':d.type==='found'?'Topilgan':'-'}\nHudud: ${d.location||'-'}\n\nKalit so‘zlar: ${(d.keywords||[]).join(', ')}\n\nTayyor tavsif:\n${d.description||'-'}\n\nQidiruv: ${d.searchQuery||'-'}\n\nMaslahatlar:\n${(d.tips||[]).map(x=>'• '+x).join('\n')}`}catch(e){out.textContent='AI ulanmagan: '+e.message}}</script></body></html>
