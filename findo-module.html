<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Findo Tool</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#101828;font:15px system-ui}header{background:#fff;border-bottom:1px solid #e5e9f0;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:900;color:#2457ff}.wrap{max-width:760px;margin:auto;padding:35px 18px}.box{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:24px}.muted{color:#667085;line-height:1.5}.btn{border:1px solid #dfe3ea;background:#fff;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:#2457ff;color:#fff;border-color:#2457ff}.form{display:grid;gap:11px;margin-top:15px}input,textarea,select{width:100%;padding:12px;border:1px solid #dfe3ea;border-radius:10px;font:inherit}textarea{min-height:120px}.result{margin-top:15px;background:#f3f6fb;border-radius:12px;padding:16px}.score{font-size:42px;font-weight:900;color:#2457ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.map{height:330px;border-radius:16px;background:linear-gradient(135deg,#e8edf7,#eef4f2);position:relative}.pin{position:absolute;font-size:28px}.qr{width:220px;height:220px;margin:20px auto;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 50%/22px 22px;border:8px solid #fff;box-shadow:0 0 0 1px #ddd}.success{background:#e8fbf3;color:#087f5b;padding:13px;border-radius:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">Findo</div><a class="btn" href="findo-dashboard.html">← Bo‘limlar</a></header><main class="wrap"><div class="box"><div id="app"></div></div></main><script>const t=new URLSearchParams(location.search).get('tool')||'search';const titles={search:['🔎','Qidirish','Yo‘qolgan va topilgan buyumlarni tez toping.'],map:['🗺️','Live Map','Hudud bo‘yicha buyumlarni ko‘ring.'],radar:['🚨','Findo Radar','Mos yangi e’lonlarni kuzating.'],nearby:['📍','Yaqin atrofim','Sizga yaqin topilgan buyumlar.'],ai:['🤖','Findo AI','Tavsifni AI yordamida tahlil qiling.'],visual:['📸','Visual Search','Rasm orqali qidirish.'],detective:['🕵️','AI Detective','Yo‘qotilgan joyni aniqlashga yordam beradi.'],voice:['🎙️','Voice Search','Gapirib qidirish.'],scan:['📷','QR Scanner','Findo QR orqali egasini topish.'],proof:['🔐','Owner Proof','Haqiqiy egani tasdiqlash.'],contact:['💬','Anonymous Contact','Raqamni bermasdan bog‘lanish.'],business:['🏢','Findo Business','Tashkilotlar uchun Lost & Found.'],community:['👥','Community','Shaharlar bo‘yicha tarmoq.'],hero:['🏆','Findo Hero','Yordam berganlar reytingi.'],reward:['💰','Reward','Topib bergan odamga mukofot.'],post:['➕','Yangi e’lon','Yo‘qolgan yoki topilgan buyumni kiriting.']};const x=titles[t]||titles.search;function render(){let h=`<div style="font-size:34px">${x[0]}</div><h1>${x[1]}</h1><p class="muted">${x[2]}</p>`;if(['search','visual','voice'].includes(t))h+=`<div class="form">${t==='visual'?'<input type="file" accept="image/*">':t==='voice'?'<button class="btn primary" onclick="voice()">🎙️ Gapirishni boshlash</button>':'<input id="q" placeholder="Masalan: qora iPhone 15 Pro Toshkent">'}<button class="btn primary" onclick="action()">${t==='search'?'🔎 Qidirish':'✨ Ishga tushirish'}</button></div><div id="out"></div>`;else if(t==='ai')h+=`<div class="form"><textarea id="q" placeholder="Qora iPhone 15 Pro Chilonzorda yo‘qoldi..."></textarea><button class="btn primary" onclick="action()">✨ AI tahlil</button></div><div id="out"></div>`;else if(t==='radar')h+=`<div class="form"><input id="q" placeholder="Qora iPhone 15 Pro"><select><option>Toshkent</option><option>Samarqand</option><option>Andijon</option></select><button class="btn primary" onclick="action()">🔔 Radarni yoqish</button></div><div id="out"></div>`;else if(t==='detective')h+=`<div class="form"><input placeholder="Oxirgi ko‘rgan joyingiz"><input placeholder="Keyin qayerga bordingiz"><input placeholder="Transport"><button class="btn primary" onclick="action()">🔎 Tahlil</button></div><div id="out"></div>`;else if(t==='map'||t==='nearby')h+=`<div class="map"><span class="pin" style="left:22%;top:30%">🔴</span><span class="pin" style="left:55%;top:60%">🟢</span><span class="pin" style="left:75%;top:25%">🔴</span></div><button class="btn primary" style="margin-top:12px" onclick="action()">📍 Joylashuvim</button><div id="out"></div>`;else if(t==='scan')h+=`<div class="map" style="display:grid;place-items:center;font-size:55px">📷</div><button class="btn primary" style="margin-top:12px" onclick="action()">QR'ni skaner qilish</button><div id="out"></div>`;else if(t==='post')h+=`<div class="form"><div class="grid"><select><option>Yo‘qolgan</option><option>Topilgan</option></select><select><option>Telefon</option><option>Hujjat</option><option>Sumka</option><option>Kalit</option><option>Boshqa</option></select></div><input placeholder="Buyum nomi"><input placeholder="Hudud"><textarea placeholder="Qisqa tavsif"></textarea><button class="btn primary" onclick="action()">E’lonni joylash</button></div><div id="out"></div>`;else h+=`<div class="result"><b>${x[1]} oynasi tayyor.</b><p class="muted">Bu bo‘lim alohida sahifa sifatida ishlaydi. Keyingi backend bosqichida real ma’lumotlar ulanadi.</p></div>`;app.innerHTML=h}function action(){out.innerHTML=t==='ai'?'<div class="result"><div class="score">92%</div><b>AI Match confidence</b><p class="muted">Kategoriya va hudud ajratildi. Real AI API keyin ulanadi.</p></div>':t==='scan'?'<div class="success">✅ Findo ID topildi. Egasi himoyalangan. “Egasi bilan bog‘lanish” orqali anonim xabar yuborish mumkin.</div>':'<div class="success">✅ Amal bajarildi. Demo ma’lumot local rejimda saqlandi.</div>'}function voice(){action()}render()</script></body></html>
