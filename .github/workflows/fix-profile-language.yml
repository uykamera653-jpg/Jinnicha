name: Fix Findo profile freeze

on:
  push:
    branches: [main]

jobs:
  repair-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove conflicting legacy modal wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('findo-live.html')
          s = p.read_text(encoding='utf-8')

          # The real feature module owns Reward, Nearby, Business, Proof,
          # Hero, Safety, QR and Detective. Do not re-add the legacy wrapper
          # that overwrites window.openM after the feature module loads.
          s = re.sub(r'\n<script>\s*/\* FINDO_PROFILE_SAFE_V2 \*/.*?</script>\s*', '\n', s, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove conflicting legacy modal wrapper"
          git push
