name: Fix Findo profile freeze

on:
  push:
    branches: [main]

jobs:
  repair-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove recursive language observers and add safe profile behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('findo-live.html')
          s = p.read_text(encoding='utf-8')

          # Remove both old language layers. They each used a MutationObserver;
          # the first observer repeatedly rewrote text nodes, while the second
          # observer repeatedly scanned the whole document. Together they can
          # lock up mobile browsers when a modal is opened.
          s = re.sub(r'<script>\s*/\* FINDO_MULTILINGUAL_V1 \*/.*?</script>', '', s, flags=re.S)
          s = re.sub(r'<script>\s*/\* FINDO_PROFILE_LANGUAGE_FIX_V1 \*/.*?</script>', '', s, flags=re.S)
          s = re.sub(r'<script>\s*/\* FINDO_PROFILE_SAFE_V2 \*/.*?</script>', '', s, flags=re.S)

          safe = r'''<script>
          /* FINDO_PROFILE_SAFE_V2 */
          (() => {
            const originalOpenM = window.openM;
            const originalCloseM = window.closeM;
            let locked = false;

            function setPageLock(on) {
              document.body.style.overflow = on ? 'hidden' : '';
              document.documentElement.style.overscrollBehavior = on ? 'none' : '';
            }

            window.openM = function(id) {
              if (locked) return;
              const modal = document.getElementById(id);
              if (!modal) return;
              locked = true;
              document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
              modal.classList.add('show');
              setPageLock(true);

              if (id === 'profile') {
                try {
                  if (typeof updateStats === 'function') updateStats();
                } catch (_) {}
              }
              requestAnimationFrame(() => { locked = false; });
            };

            window.closeM = function() {
              document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
              setPageLock(false);
              locked = false;
            };

            document.addEventListener('keydown', e => {
              if (e.key === 'Escape') window.closeM();
            }, { passive: true });

            document.addEventListener('click', e => {
              const modal = e.target.closest('.modal');
              if (modal && e.target === modal) window.closeM();
            }, true);
          })();
          </script>'''

          s = s.replace('</body>', safe + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix profile modal freeze"
          git push
