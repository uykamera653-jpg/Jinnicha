name: Fix Findo language observer

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix observer loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('findo-live.html')
          s=p.read_text(encoding='utf-8')
          old="const obs=new MutationObserver(()=>{if(document.getElementById('langBtn'))apply()});obs.observe(document.body,{childList:true,subtree:true});"
          new="let applying=false; const obs=new MutationObserver(()=>{if(!applying&&document.getElementById('langBtn')){applying=true;apply();applying=false}});obs.observe(document.body,{childList:true,subtree:true});"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Findo multilingual observer"
          git push
