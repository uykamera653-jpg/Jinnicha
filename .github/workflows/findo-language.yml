name: Findo multilingual layer

on:
  push:
    branches: [main]

jobs:
  multilingual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install safe multilingual loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('findo-live.html')
          s = p.read_text(encoding='utf-8')
          # Remove old language layers, including the observer that caused the profile freeze.
          s = re.sub(r'<script>\s*/\* FINDO_MULTILINGUAL_V1 \*/.*?</script>\s*', '', s, flags=re.S)
          s = re.sub(r'<script>\s*/\* FINDO_MULTILINGUAL_V2 \*/.*?</script>\s*', '', s, flags=re.S)
          # Remove any previous external loader before adding the canonical one.
          s = re.sub(r'\s*<script\s+src=["\']findo-i18n\.js["\']\s*></script>', '', s)
          s = s.replace('</body>', '<script src="findo-i18n.js"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable safe Uzbek Russian English switching"
          git push
