name: Install Findo real feature modules
on:
  push:
    branches: [main]
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install versioned feature module script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('findo-live.html')
          s=p.read_text(encoding='utf-8')
          import re
          tag='<script src="findo-features.js?v=20260826-1926"></script>'
          s=re.sub(r'<script src="findo-features\.js(?:\?[^" ]*)?"></script>', tag, s)
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Bust Findo feature module cache"
          git push
