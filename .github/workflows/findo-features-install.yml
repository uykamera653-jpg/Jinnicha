name: Install Findo real feature modules
on:
  push:
    branches: [main]
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install and repair real feature layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('findo-live.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="findo-features.js?v=20260826-1935"></script>'
          s=re.sub(r'<script src="findo-features\.js(?:\?[^" ]*)?"></script>', tag, s)
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          s=re.sub(r'\n<script>\s*/\* FINDO_PROFILE_SAFE_V2 \*/.*?</script>\s*', '\n', s, flags=re.S)
          p.write_text(s,encoding='utf-8')

          f=Path('findo-features.js')
          fs=f.read_text(encoding='utf-8')
          old='m.innerHTML=html;return m'
          new='m.innerHTML=html;m.classList.add(\'show\');return m'
          if old in fs:
              fs=fs.replace(old,new,1)
          f.write_text(fs,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html findo-features.js
          git diff --cached --quiet && exit 0
          git commit -m "Repair Findo feature renderer"
          git push
