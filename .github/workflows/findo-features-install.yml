name: Install Findo real feature modules
on:
  push:
    branches: [main]
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load Findo QR module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('findo-live.html')
          s=p.read_text(encoding='utf-8')
          feature='<script src="findo-features.js?v=20260826-qr3"></script>'
          qr='<script src="findo-qr.js?v=20260826-qr1"></script>'
          s=re.sub(r'<script src="findo-features\\.js(?:\\?[^" ]*)?"></script>',feature,s)
          s=re.sub(r'\s*<script src="findo-qr\\.js(?:\\?[^" ]*)?"></script>','',s)
          s=s.replace(feature,feature+'\n'+qr,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Load Findo QR module"
          git push
