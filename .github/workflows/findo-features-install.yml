name: Install Findo real feature modules
on:
  push:
    branches: [main]
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add feature module script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('findo-live.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="findo-features.js"></script>'
          if tag in s:
              print('Feature module already installed')
              raise SystemExit(0)
          s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findo-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Install real Findo feature modules"
          git push
