name: Add Findo AI modes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, 'Add Findo AI modes loader') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add AI modes loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/findo-ai-modes.js?v=20260827"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Findo AI modes loader'
          git push
