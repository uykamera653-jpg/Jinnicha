<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Findo AI — Aqlli qidiruv</title>
<style>
:root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.page{min-height:100vh;display:flex;flex-direction:column}.top{height:72px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid #edf1f6;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.logo{font-size:31px;font-weight:950;letter-spacing:-2px;color:var(--blue)}.ai-badge{font-size:12px;font-weight:800;color:#475569;background:#f1f5f9;border:1px solid var(--line);padding:9px 12px;border-radius:999px}.main{width:min(760px,100%);margin:auto;padding:54px 18px 70px;flex:1}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--blue);background:#eff6ff;border:1px solid #dbeafe;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:850}.title{font-size:clamp(40px,8vw,64px);line-height:.98;letter-spacing:-3.5px;margin:20px 0 14px;font-weight:900}.title b{color:var(--blue)}.sub{font-size:17px;line-height:1.55;color:var(--muted);max-width:650px;margin:0 0 30px}.search-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:10px;box-shadow:0 24px 70px rgba(15,23,42,.09)}textarea{display:block;width:100%;min-height:145px;border:0;outline:0;resize:none;padding:16px 15px;font:inherit;font-size:16px;color:var(--ink);background:transparent}textarea::placeholder{color:#94a3b8}.tools{display:flex;gap:8px;padding:5px}.tool{height:46px;min-width:46px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:20px;cursor:pointer}.search-btn{flex:1;border:0;background:var(--blue);color:#fff;border-radius:14px;font-weight:850;font-size:15px;cursor:pointer}.search-btn:disabled{opacity:.65;cursor:wait}.hint{display:flex;gap:9px;align-items:center;color:#64748b;font-size:12px;margin:14px 4px}.result{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}.result.show{display:block}.result-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.result h2{font-size:18px;margin:0}.status{font-size:11px;font-weight:800;color:#15803d;background:#f0fdf4;padding:7px 9px;border-radius:999px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fact{background:#f8fafc;border-radius:14px;padding:12px}.fact span{display:block;color:#94a3b8;font-size:10px;margin-bottom:4px}.fact strong{font-size:13px}.desc{margin-top:12px;background:#f8fafc;border-radius:14px;padding:13px;font-size:13px;line-height:1.5}.keywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tag{background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:750}.error{color:#b91c1c;background:#fef2f2;border-color:#fecaca}.foot{text-align:center;color:#94a3b8;font-size:11px;padding:18px}@media(max-width:600px){.top{height:62px;padding:0 16px}.logo{font-size:28px}.main{padding:38px 14px 50px}.title{font-size:43px;letter-spacing:-2.5px}.sub{font-size:15px}.search-card{border-radius:22px}.tools{padding:4px}.tool{height:48px}.search-btn{height:48px}.result-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
<header class="top"><div class="logo">Findo</div><div class="ai-badge">✦ AI SEARCH</div></header>
<main class="main">
<div class="eyebrow">✦ Findo AI</div>
<h1 class="title">Narsangizni <b>AI bilan toping.</b></h1>
<p class="sub">Yo‘qolgan buyumingizni oddiy tilda tasvirlang. Findo AI muhim belgilarni ajratadi va qidiruv uchun aniq so‘rov tayyorlaydi.</p>
<section class="search-card">
<textarea id="q" placeholder="Masalan: Kecha Chilonzorda qora g‘ilofli iPhone 15 Pro telefonim yo‘qoldi. Orqasida kichik tirnalgan joy bor..."></textarea>
<div class="tools"><button class="tool" id="mic" type="button" title="Ovoz bilan yozish">🎙</button><button class="tool" id="clear" type="button" title="Tozalash">×</button><button class="search-btn" id="go" type="button">✦ AI bilan qidirish</button></div>
</section>
<div class="hint">🔒 Siz yozgan ma’lumot faqat qidiruvni yaxshilash uchun ishlatiladi.</div>
<section id="result" class="result"></section>
</main>
<footer class="foot">Findo AI · Aqlli yo‘qolgan buyumlar qidiruvi</footer>
</div>
<script>
const q=document.getElementById('q'),go=document.getElementById('go'),out=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(d){const kws=Array.isArray(d.keywords)?d.keywords:[];out.className='result show';out.innerHTML='<div class="result-head"><h2>AI tahlili</h2><span class="status">Tayyor</span></div><div class="result-grid"><div class="fact"><span>Buyum</span><strong>'+esc(d.title||'Aniqlanmadi')+'</strong></div><div class="fact"><span>Kategoriya</span><strong>'+esc(d.category||'Aniqlanmadi')+'</strong></div><div class="fact"><span>Holat</span><strong>'+esc(d.type==='lost'?'Yo‘qolgan':d.type==='found'?'Topilgan':'Aniqlanmadi')+'</strong></div><div class="fact"><span>Hudud</span><strong>'+esc(d.location||'Ko‘rsatilmagan')+'</strong></div></div><div class="desc"><b>Qidiruv so‘rovi</b><br>'+esc(d.searchQuery||d.description||'')+'</div>'+(kws.length?'<div class="keywords">'+kws.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div>':'')}
async function search(){const text=q.value.trim();if(!text){out.className='result show error';out.textContent='Avval nima yo‘qolganini yozing.';return}go.disabled=true;go.textContent='AI tahlil qilmoqda…';out.className='result show';out.textContent='Buyumingiz tahlil qilinmoqda…';try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'analyze',text})});const d=await r.json();if(!r.ok)throw new Error(d.error||'AI xatosi');show(d)}catch(e){out.className='result show error';out.textContent='AI ishlamadi: '+e.message}finally{go.disabled=false;go.textContent='✦ AI bilan qidirish'}}
go.onclick=search;q.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')search()});document.getElementById('clear').onclick=()=>{q.value='';out.className='result';q.focus()};document.getElementById('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){out.className='result show error';out.textContent='Bu brauzerda ovozli qidiruv qo‘llab-quvvatlanmaydi.';return}const r=new R();r.lang='uz-UZ';r.onresult=e=>{q.value=e.results[0][0].transcript};r.start()};
</script>
</body></html>
