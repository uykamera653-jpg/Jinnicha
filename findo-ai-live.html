<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Findo AI — Aqlli qidiruv</title><style>:root{--b:#1769ff;--ink:#0b1220;--muted:#718096;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(145deg,#f8fbff,#eef5ff);color:var(--ink)}main{max-width:1000px;margin:auto;padding:22px 15px 60px}.head{display:flex;align-items:center;gap:12px;margin:8px 0 25px}.logo{font-size:30px;font-weight:950;color:var(--b);letter-spacing:-2px}.pill{margin-left:auto;border:1px solid #dce6f4;background:#fff;padding:8px 11px;border-radius:99px;font-size:10px;color:#64748b}.hero{background:#fff;border:1px solid var(--line);border-radius:30px;padding:25px;box-shadow:0 25px 70px #1e50aa12}.bot{width:70px;height:70px;border-radius:23px;background:linear-gradient(145deg,#155cff,#79aaff);display:grid;place-items:center;box-shadow:0 15px 30px #1769ff30;margin-bottom:18px}.bot:after{content:'✦';font-size:34px;color:#fff}.tag{display:inline-block;color:#1764ed;background:#edf4ff;border:1px solid #dbe8ff;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:900}.hero h1{font-size:clamp(38px,7vw,66px);line-height:.98;letter-spacing:-3px;margin:15px 0 12px}.hero h1 b{color:var(--b)}.desc{color:var(--muted);line-height:1.55;max-width:690px;font-size:14px}.box{margin-top:22px;border:1px solid var(--line);border-radius:22px;padding:10px}.box textarea{width:100%;height:125px;border:0;outline:0;resize:none;padding:12px;font-size:15px}.preview{display:none;margin:5px 0 10px;position:relative}.preview img{max-height:180px;max-width:100%;border-radius:15px}.tools{display:flex;gap:8px}.tools button{height:48px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 15px;font-weight:800}.tools .go{flex:1;background:var(--b);border-color:var(--b);color:#fff}.status{margin-top:13px;display:none;background:#f7f9fc;border-radius:15px;padding:12px;font-size:11px;color:#66758b}.status.show{display:block}.results{margin-top:18px;display:none}.results.show{display:block}.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.rhead h2{font-size:18px;margin:0}.count{font-size:10px;color:#7b8799}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden}.pic{height:190px;background:#edf3fa;display:grid;place-items:center;color:#8b98aa;font-size:10px}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.row{display:flex;gap:7px;justify-content:space-between}.title{font-size:13px;font-weight:850}.score{font-size:9px;font-weight:900;color:#1764ed;background:#edf4ff;border-radius:99px;padding:5px 7px;white-space:nowrap}.meta{font-size:9px;color:#7b8799;margin:7px 0}.why{font-size:9px;color:#68758a;background:#f7f9fc;border-radius:10px;padding:8px;line-height:1.4}.open{width:100%;height:38px;border:0;border-radius:10px;background:#1764ed;color:#fff;font-size:10px;font-weight:850;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.pic{height:150px}}@media(max-width:470px){main{padding:12px 11px 40px}.hero{padding:19px;border-radius:24px}.grid{grid-template-columns:1fr}.pic{height:210px}.tools button{padding:0 12px}}</style></head><body><main><header class="head"><div class="logo">Findo</div><div class="pill">✦ Sun’iy intellekt</div></header><section class="hero"><div class="bot"></div><span class="tag">FINDO AI · MULTIMODAL QIDIRUV</span><h1>Narsangizni <b>istalgan belgisi</b> bilan toping.</h1><p class="desc">Rasm yuklang, yozing yoki ovoz bilan ayting. Findo AI buyumning ko‘rinishi, rangi, shakli, brendi, belgilarini va tavsifini tahlil qilib, Findo’dagi eng mos e’lonlarni topadi.</p><div class="box"><textarea id="text" placeholder="Masalan: qora iPhone 15 Pro, orqasida kichik tirnalish bor, Chilonzorda yo‘qolgan..."></textarea><div id="preview" class="preview"><img id="photo" alt="Yuklangan rasm"></div><div class="tools"><button id="image">📷 Rasm</button><button id="voice">🎙 Ovoz</button><button id="clear">×</button><button id="go" class="go">✦ Findo AI bilan topish</button></div></div><div id="status" class="status"></div><section id="results" class="results"><div class="rhead"><h2>AI topgan mos e’lonlar</h2><span id="count" class="count"></span></div><div id="grid" class="grid"></div></section></section></main><script>const $=id=>document.getElementById(id),text=$('text'),go=$('go'),status=$('status'),results=$('results'),grid=$('grid');let imageData='';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function msg(v){status.textContent=v;status.classList.add('show')}$('clear').onclick=()=>{text.value='';imageData='';$('preview').style.display='none';status.classList.remove('show');results.classList.remove('show')};$('image').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files?.[0];if(!f)return;if(f.size>8*1024*1024){msg('Rasm hajmi 8 MB dan kichik bo‘lishi kerak.');return}const r=new FileReader();r.onload=()=>{imageData=r.result;$('photo').src=imageData;$('preview').style.display='block';msg('Rasm tayyor. Endi Findo AI bilan qidiring.')};r.readAsDataURL(f)};i.click()};$('voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){msg('Bu brauzer ovozli qidiruvni qo‘llab-quvvatlamaydi.');return}const v=new R();v.lang='uz-UZ';v.interimResults=false;v.onstart=()=>msg('Ovoz tinglanmoqda…');v.onresult=e=>{text.value=(text.value?' '+text.value:'')+e.results[0][0].transcript;msg('Ovoz matnga aylantirildi.')};v.onerror=()=>msg('Ovozli qidiruvni amalga oshirib bo‘lmadi.');v.start()};go.onclick=async()=>{const t=text.value.trim();if(!t&&!imageData){msg('Avval matn yozing yoki rasm yuklang.');return}go.disabled=true;go.textContent='AI tahlil qilmoqda…';results.classList.remove('show');msg('Buyum belgilarini tahlil qilib, mos e’lonlar qidirilmoqda…');try{const rr=await fetch('/api/ai-vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,image:imageData})});const d=await rr.json();if(!rr.ok)throw Error(d.error||'AI qidiruv xatosi');render(d,t);msg('Qidiruv tugadi. Eng mos e’lonlar yuqorida.')}catch(e){msg(e.message||'Qidiruvda xato yuz berdi.')}finally{go.disabled=false;go.textContent='✦ Findo AI bilan topish'}};function render(d,t){const m=Array.isArray(d.matches)?d.matches:[];$('count').textContent=m.length+' ta mos e’lon';grid.innerHTML=m.length?m.map(a=>{const s=Math.max(0,Math.min(99,Math.round((Number(a.similarity)||0)*100)));const im=a.image_path?'<img src="'+esc(a.image_path)+'" alt="">':'Rasm yo‘q';return '<article class="card"><div class="pic">'+im+'</div><div class="body"><div class="row"><div class="title">'+esc(a.title||'Nomsiz e’lon')+'</div><span class="score">'+s+'% mos</span></div><div class="meta">'+esc(a.category||'')+' · '+esc(a.location||'')+'</div><div class="why">AI mosligi: buyum tavsifi va mavjud belgilar bo‘yicha.</div><button class="open" data-id="'+esc(a.id)+'">E’lonni ko‘rish</button></div></article>'}).join(''):'<div style="grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:35px;text-align:center;color:#718096;font-size:12px">Hozircha mos e’lon topilmadi. Batafsilroq tavsif yoki rasm bilan qayta urinib ko‘ring.</div>';results.classList.add('show');grid.querySelectorAll('.open').forEach(b=>b.onclick=()=>{location.href='?item='+encodeURIComponent(b.dataset.id)});results.scrollIntoView({behavior:'smooth',block:'start'})}</script></body></html>
